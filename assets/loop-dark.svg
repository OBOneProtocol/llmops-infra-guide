<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="t">
<title id="t">How dockergen works: inspect the project, the LLM writes a Dockerfile, safety checks refuse risky features, docker build judges it. A refusal or a failed build sends the previous Dockerfile plus the refusal reason or the last 40 lines of build output back to the LLM for another attempt, up to --attempts times; if every attempt fails, it exits 1.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9da7b3"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs>
<rect x=".5" y=".5" width="879" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="20" y="40" width="136" height="76" rx="10" fill="#161b22" stroke="#9da7b3" stroke-width="1.5"/><text x="88.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9da7b3">1  Inspect</text><text x="88.0" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">file names +</text><text x="88.0" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">one manifest</text>
<line x1="160" y1="78.0" x2="192" y2="78.0" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="196" y="40" width="136" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="264.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">2  Generate</text><text x="264.0" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">the LLM writes</text><text x="264.0" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">a Dockerfile</text>
<line x1="336" y1="78.0" x2="368" y2="78.0" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="372" y="40" width="136" height="76" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/><text x="440.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e3b341">3  Check</text><text x="440.0" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">refuse risky</text><text x="440.0" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">features</text>
<line x1="512" y1="78.0" x2="544" y2="78.0" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="548" y="40" width="136" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="616.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">4  Build</text><text x="616.0" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">docker build</text><text x="616.0" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">is the judge</text>
<line x1="688" y1="78.0" x2="720" y2="78.0" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="724" y="40" width="136" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="792.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3fb950">Done</text><text x="792.0" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">Dockerfile kept,</text><text x="792.0" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">exit 0</text>
<text x="708" y="30" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#3fb950">builds</text>
<path d="M616.0 120 V174 H264.0 V122" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
<path d="M440.0 120 V174" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440.0" y="196" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#f85149">previous Dockerfile + the refusal reason or last 40 build lines go back</text>
<text x="440.0" y="216" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">up to --attempts rounds (default 3), then exit 1 with the last Dockerfile left for inspection</text>
<text x="108.0" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">project directory</text>
</svg>
